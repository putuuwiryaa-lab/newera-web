name: Apply Evaluation Semantics Fix

on:
  push:
    branches:
      - fix/engine-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-correctness
      - name: Clarify evaluator scope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/EvaluationPanel.tsx')
          text = path.read_text()
          replacements = {
              'Evaluasi Walk-Forward Out-of-Sample': 'Evaluasi Walk-Forward Lokal (TypeScript)',
              'Simulasi backtesting ketat bergulir 1 putaran demi 1 putaran tanpa kebocoran data masa depan': 'Backtest lokal bergulir tanpa data masa depan; diagnostik ini bukan log performa production backend Python',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'target not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          Path('.github/workflows/apply-evaluation-semantics-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EvaluationPanel.tsx .github/workflows/apply-evaluation-semantics-fix.yml
          git commit -m "fix(evaluation): distinguish local replay from production metrics"
          git push origin HEAD:fix/engine-correctness
