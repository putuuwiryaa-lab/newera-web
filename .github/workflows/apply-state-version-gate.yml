name: Apply Persisted State Version Gate

on:
  push:
    branches:
      - fix/engine-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-correctness
      - name: Gate Firestore prediction by engine version and history basis
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'target not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/engine/serverState.ts',
              "import { auditAndCalibrate, type CalibrationAudit } from './smartCalibrator';\n",
              "import { auditAndCalibrate, type CalibrationAudit } from './smartCalibrator';\n\nexport const PRODUCTION_ENGINE_VERSION = '2026.09.11-v2';\n\nexport function serverPredictionMatchesHistory(server: any, results4D: string[]): boolean {\n  if (!server || typeof server !== 'object' || results4D.length === 0) return false;\n  const version = String(server.engine_version ?? server.engineVersion ?? '');\n  const basisCount = Number(server.basis_draw_count ?? server.basisDrawCount ?? -1);\n  const basisLastDraw = String(server.basis_last_draw ?? server.basisLastDraw ?? '');\n  return (\n    version === PRODUCTION_ENGINE_VERSION\n    && basisCount === results4D.length\n    && basisLastDraw === results4D[results4D.length - 1]\n  );\n}\n"
          )

          replace_once(
              'src/engine/serverState.ts',
              '''export function mergeServerPrediction(\n  local: PredictionResult | null,\n  server: any\n): PredictionResult | null {\n  if (!local || !server || typeof server !== 'object') return local;''',
              '''export function mergeServerPrediction(\n  local: PredictionResult | null,\n  server: any,\n  results4D: string[]\n): PredictionResult | null {\n  if (!local || !serverPredictionMatchesHistory(server, results4D)) return local;'''
          )

          replace_once(
              'src/engine/serverState.ts',
              '''  if (!serverAudit || typeof serverAudit !== 'object') return null;\n  const actualFull = String(serverAudit.actual_result || results4D[results4D.length - 1] || '0000');\n  if (!/^\\d{4}$/.test(actualFull)) return null;''',
              '''  if (!serverAudit || typeof serverAudit !== 'object') return null;\n  if (!serverPredictionMatchesHistory(nextPrediction, results4D)) return null;\n  const currentLast = results4D[results4D.length - 1] || '';\n  const actualFull = String(serverAudit.actual_result || currentLast || '0000');\n  if (!/^\\d{4}$/.test(actualFull) || actualFull !== currentLast) return null;'''
          )

          replace_once(
              'src/App.tsx',
              'return mergeServerPrediction(localPrediction, currentMarket?.next_prediction);',
              'return mergeServerPrediction(localPrediction, currentMarket?.next_prediction, currentResults4D);'
          )

          replace_once(
              'src/components/SharePredictionModal.tsx',
              'map.set(m.id, mergeServerPrediction(local, m.next_prediction));',
              'map.set(m.id, mergeServerPrediction(local, m.next_prediction, history4D));'
          )

          Path('.github/workflows/apply-state-version-gate.yml').unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/serverState.ts src/App.tsx src/components/SharePredictionModal.tsx .github/workflows/apply-state-version-gate.yml
          git commit -m "fix(state): reject stale or legacy Firestore predictions"
          git push origin HEAD:fix/engine-correctness
