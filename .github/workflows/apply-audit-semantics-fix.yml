name: Apply Audit Semantics Fix

on:
  push:
    branches:
      - fix/engine-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-correctness
      - name: Separate production audit from local reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'target not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/App.tsx',
              '''  // Firestore last_audit adalah source of truth ketika tersedia. Fallback ke\n  // rekonstruksi lokal hanya untuk cached/legacy market yang belum punya state.\n  const calibrationAudit = useMemo(() => {\n    if (currentResults4D.length < 15) return null;\n    const persisted = calibrationAuditFromServer(\n      currentMarket?.last_audit,\n      currentMarket?.next_prediction,\n      currentResults4D\n    );\n    return persisted || auditAndCalibrate(currentResults4D);\n  }, [currentResults4D, currentMarket]);''',
              '''  // Untuk source live, hanya last_audit production yang boleh tampil sebagai audit aktif.\n  // Rekonstruksi lokal dipakai saat cached/offline, bukan untuk memalsukan audit live yang belum ada.\n  const calibrationAudit = useMemo(() => {\n    if (currentResults4D.length < 15) return null;\n    const persisted = calibrationAuditFromServer(\n      currentMarket?.last_audit,\n      currentMarket?.next_prediction,\n      currentResults4D\n    );\n    if (persisted) return persisted;\n    return dataSource === 'cached' ? auditAndCalibrate(currentResults4D) : null;\n  }, [currentResults4D, currentMarket, dataSource]);'''
          )

          replace_once(
              'src/App.tsx',
              'Memori Kalibrasi & Log Penyetelan',
              'Audit Production & Rekonstruksi Walk-Forward'
          )
          replace_once(
              'src/App.tsx',
              'Pilih domain: Peluang marginal AI, densitas BBFS, atau Audit Paito Makro',
              'Audit aktif berasal dari Firestore; timeline 7 periode di bawah adalah rekonstruksi walk-forward'
          )

          replace_once(
              'src/components/TuningTimeline.tsx',
              'Audit Respons Kalibrasi & Auto-Tuning',
              'Rekonstruksi Walk-Forward 7 Periode'
          )
          replace_once(
              'src/components/TuningTimeline.tsx',
              'Riwayat adaptif 7 periode terakhir: deteksi akurasi, pembekuan bobot, dan pemulihan deterministik',
              'Simulasi ulang dari history untuk diagnostik; bukan log production Firestore yang tersimpan'
          )
          replace_once(
              'src/components/TuningTimeline.tsx',
              '<span className="text-slate-400">Strike &ge;2/3:</span>',
              '<span className="text-slate-400">Strike &ge;2/4:</span>'
          )

          Path('.github/workflows/apply-audit-semantics-fix.yml').unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/TuningTimeline.tsx .github/workflows/apply-audit-semantics-fix.yml
          git commit -m "fix(audit): separate production state from reconstructed diagnostics"
          git push origin HEAD:fix/engine-correctness
