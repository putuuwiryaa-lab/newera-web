name: Apply Final Audit Fixes

on:
  push:
    branches:
      - fix/engine-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-correctness
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/AIDashboard.tsx')
          s = p.read_text()
          old = "const polaTarungStr = `Kepala: ${activeDigits.join(',')} | Ekor: ${activeDigits.join(',')}`;"
          new = "const polaTarungStr = prediction.polaTarung\n    ? `Kepala: ${prediction.polaTarung.rankedKepala.slice(0, 4).join(',')} | Ekor: ${prediction.polaTarung.rankedEkor.slice(0, 4).join(',')}`\n    : `AI-${selectedTier}: ${activeDigits.join(',')}`;"
          if old not in s:
              raise SystemExit('AIDashboard target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/LineGeneratorModal.tsx')
          s = p.read_text()
          old = '★ Covering Design Hemat Hingga 96%'
          new = '★ Coverage subset kombinasi — bukan jaminan straight'
          if old not in s:
              raise SystemExit('LineGenerator target not found')
          p.write_text(s.replace(old, new, 1))

          # Workflow ini hanya alat patch satu-kali; hapus dari hasil akhir branch.
          Path('.github/workflows/apply-final-audit-fixes.yml').unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AIDashboard.tsx src/components/LineGeneratorModal.tsx .github/workflows/apply-final-audit-fixes.yml
          git commit -m "fix(ui): use real pola tarung and remove misleading wheeling claim"
          git push origin HEAD:fix/engine-correctness
