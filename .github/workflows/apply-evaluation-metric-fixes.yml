name: Apply Evaluation Metric Fixes

on:
  push:
    branches:
      - fix/engine-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-correctness
      - name: Patch evaluator metrics and labels
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'target not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/engine/types.ts',
              '''  superSniperHits?: number;\n  superSniperRate?: number;\n  avgSuperSniperLines?: number;\n  superSniperPnlNet?: number;\n  sniperBomHits: number;\n  sniperBomRate: number;\n  avgSniperLines: number;\n  sniperPnlNet: number;''',
              '''  superSniperHits?: number;\n  superSniperRate?: number;\n  superSniperActiveDraws?: number;\n  superSniperParticipationRate?: number;\n  avgSuperSniperLines?: number;\n  superSniperPnlNet?: number;\n  sniperBomHits: number;\n  sniperBomRate: number;\n  sniperActiveDraws: number;\n  sniperParticipationRate: number;\n  avgSniperLines: number;\n  sniperPnlNet: number;'''
          )

          replace_once(
              'src/engine/evaluator.ts',
              '''  let sniperBomHits = 0, totalSniperLines = 0, sniperPnl = 0;\n  let superSniperHits = 0, totalSuperSniperLines = 0, superSniperPnl = 0;''',
              '''  let sniperBomHits = 0, totalSniperLines = 0, sniperPnl = 0, sniperActiveDraws = 0;\n  let superSniperHits = 0, totalSuperSniperLines = 0, superSniperPnl = 0, superSniperActiveDraws = 0;'''
          )
          replace_once(
              'src/engine/evaluator.ts',
              '''      const sniperSettlement = settleLines(sniperTop, actual2D);\n      totalSniperLines += sniperSettlement.cost;\n      sniperPnl += sniperSettlement.net;\n      if (sniperSettlement.hit) sniperBomHits++;\n\n      const superSettlement = settleLines(superSniper, actual2D);\n      totalSuperSniperLines += superSettlement.cost;\n      superSniperPnl += superSettlement.net;\n      if (superSettlement.hit) superSniperHits++;''',
              '''      const sniperSettlement = settleLines(sniperTop, actual2D);\n      totalSniperLines += sniperSettlement.cost;\n      sniperPnl += sniperSettlement.net;\n      if (sniperSettlement.cost > 0) sniperActiveDraws++;\n      if (sniperSettlement.hit) sniperBomHits++;\n\n      const superSettlement = settleLines(superSniper, actual2D);\n      totalSuperSniperLines += superSettlement.cost;\n      superSniperPnl += superSettlement.net;\n      if (superSettlement.cost > 0) superSniperActiveDraws++;\n      if (superSettlement.hit) superSniperHits++;'''
          )
          replace_once(
              'src/engine/evaluator.ts',
              '''    superSniperHits,\n    superSniperRate: Number(((superSniperHits / testDraws) * 100).toFixed(2)),\n    avgSuperSniperLines: Number((totalSuperSniperLines / testDraws).toFixed(1)),\n    superSniperPnlNet: superSniperPnl * 1000,\n    sniperBomHits,\n    sniperBomRate: Number(((sniperBomHits / testDraws) * 100).toFixed(2)),\n    avgSniperLines: Number((totalSniperLines / testDraws).toFixed(1)),\n    sniperPnlNet: sniperPnl * 1000,''',
              '''    superSniperHits,\n    superSniperRate: Number(((superSniperHits / Math.max(1, superSniperActiveDraws)) * 100).toFixed(2)),\n    superSniperActiveDraws,\n    superSniperParticipationRate: Number(((superSniperActiveDraws / testDraws) * 100).toFixed(2)),\n    avgSuperSniperLines: Number((totalSuperSniperLines / Math.max(1, superSniperActiveDraws)).toFixed(1)),\n    superSniperPnlNet: superSniperPnl * 1000,\n    sniperBomHits,\n    sniperBomRate: Number(((sniperBomHits / Math.max(1, sniperActiveDraws)) * 100).toFixed(2)),\n    sniperActiveDraws,\n    sniperParticipationRate: Number(((sniperActiveDraws / testDraws) * 100).toFixed(2)),\n    avgSniperLines: Number((totalSniperLines / Math.max(1, sniperActiveDraws)).toFixed(1)),\n    sniperPnlNet: sniperPnl * 1000,'''
          )

          replace_once(
              'src/components/EvaluationPanel.tsx',
              'Performa out-of-sample penyaring paito dan simulasi taruhan hemat ~90% modal',
              'Hit-rate filter dihitung saat ada line aktif; PnL tetap mencakup seluruh putaran evaluasi'
          )
          replace_once(
              'src/components/EvaluationPanel.tsx',
              '<span className="text-[10px] font-mono text-slate-500">Teoretis: 30.0%</span>',
              '<span className="text-[10px] font-mono text-slate-500">Teoretis: {paitoStats.bijiBaseline.toFixed(1)}%</span>'
          )
          replace_once(
              'src/components/EvaluationPanel.tsx',
              '''                <span className="flex items-center space-x-1">\n                  <span>🐴 Top 3 Shio 2026</span>\n                </span>\n                <span className="text-[10px] font-mono text-slate-500">Teoretis: 25.0%</span>''',
              '''                <span className="flex items-center space-x-1">\n                  <span>🐴 Top 3 Shio 2026</span>\n                </span>\n                <span className="text-[10px] font-mono text-slate-500">Teoretis: {(paitoStats.shioBaseline ?? 0).toFixed(1)}%</span>'''
          )
          replace_once(
              'src/components/EvaluationPanel.tsx',
              '''                <div className="text-xs text-slate-400 mt-0.5">\n                  Hit BOM: {paitoStats.sniperBomHits}x tembus\n                </div>''',
              '''                <div className="text-xs text-slate-400 mt-0.5">\n                  Hit {paitoStats.sniperBomHits} dari {paitoStats.sniperActiveDraws} draw aktif • partisipasi {paitoStats.sniperParticipationRate}%\n                </div>'''
          )
          replace_once(
              'src/components/EvaluationPanel.tsx',
              '''                <div className="text-xs text-slate-400 mt-0.5">\n                  Hit Super: {paitoStats.superSniperHits ?? 0}x tembus\n                </div>''',
              '''                <div className="text-xs text-slate-400 mt-0.5">\n                  Hit {paitoStats.superSniperHits ?? 0} dari {paitoStats.superSniperActiveDraws ?? 0} draw aktif • partisipasi {paitoStats.superSniperParticipationRate ?? 0}%\n                </div>'''
          )
          replace_once(
              'src/components/EvaluationPanel.tsx',
              'Simulasi Riil Non-Twin',
              'Line non-twin • twin dihitung loss'
          )

          Path('.github/workflows/apply-evaluation-metric-fixes.yml').unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/types.ts src/engine/evaluator.ts src/components/EvaluationPanel.tsx .github/workflows/apply-evaluation-metric-fixes.yml
          git commit -m "fix(evaluation): separate sniper abstain from misses"
          git push origin HEAD:fix/engine-correctness
