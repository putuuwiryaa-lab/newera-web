name: Engine Correctness CI

# Validate both proposed fixes and production main after merge.
on:
  push:
    branches:
      - main
      - fix/engine-correctness
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
